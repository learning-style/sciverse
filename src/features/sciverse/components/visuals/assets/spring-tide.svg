<svg width="140" height="80" viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun -->
  <circle cx="20" cy="40" r="12" fill="#FFD700" stroke="#E6B800" stroke-width="2" />
  <text x="20" y="75" font-size="10" text-anchor="middle" fill="#555">Sun</text>
  <!-- Earth -->
  <circle cx="70" cy="40" r="10" fill="#3B82F6" stroke="#1E40AF" stroke-width="2" />
  <text x="70" y="75" font-size="10" text-anchor="middle" fill="#555">Earth</text>
  <!-- Moon -->
  <circle cx="120" cy="40" r="7" fill="#B0BEC5" stroke="#64748B" stroke-width="2" />
  <text x="120" y="75" font-size="10" text-anchor="middle" fill="#555">Moon</text>
  <!-- Alignment line -->
  <line x1="20" y1="40" x2="120" y2="40" stroke="#F87171" stroke-width="2" stroke-dasharray="4 2" />
</svg>